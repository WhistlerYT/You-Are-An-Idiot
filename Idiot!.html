<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Idiot!</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body {
      margin:0;
      height:100vh;
      background:#000 url('https://media1.tenor.com/m/9MVlipGuNioAAAAd/you-are-an-idiot.gif') center/cover no-repeat;
      overflow:hidden;
    }
    #muteBtn {
      position:fixed;
      left:10px;
      top:10px;
      z-index:9999;
      background:#0ea5e9;
      border:none;
      padding:8px 12px;
      border-radius:8px;
      color:white;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>
<body>

  <button id="muteBtn">Mute</button>
  <!-- replace with your actual mp3 filename -->
  <audio id="mainAudio" src="you-are-an-idiot.mp3" loop autoplay></audio>

  <script>
  (() => {
    const GIF_NAME="https://media1.tenor.com/m/9MVlipGuNioAAAAd/you-are-an-idiot.gif";
    const mainAudio=document.getElementById('mainAudio');
    const muteBtn=document.getElementById('muteBtn');
    let childWindows=[];

    // ensure audio tries to play immediately
    mainAudio.play().catch(()=>{});

    function openPopupWindow(){
      const w=420,h=300;
      const left=Math.min(Math.max(Math.floor(Math.random()*(screen.width-w)),0),screen.width-w);
      const top=Math.min(Math.max(Math.floor(Math.random()*(screen.height-h)),0),screen.height-h);
      const features=`width=${w},height=${h},left=${left},top=${top},resizable=no,menubar=no,toolbar=no,location=no,status=no`;
      const win=window.open('','_blank',features);
      if(!win){console.warn('Popup blocked'); return null;}

      const popupHtml=`<!doctype html>
      <html><head><meta charset="utf-8">
      <title>☺</title>
      <style>
        html,body{height:100%;margin:0;background:#000}
        img{width:100%;height:100%;display:block;}
      </style>
      </head><body>
        <img src="${GIF_NAME}" alt="YAAI GIF"/>
        <script>
          let posX=Math.floor(Math.random()*(screen.width-420));
          let posY=Math.floor(Math.random()*(screen.height-300));
          let velX=(Math.random()<0.5?1:-1)*20;
          let velY=(Math.random()<0.5?1:-1)*15;

          let popupAudio=new Audio('you-are-an-idiot.mp3');
          popupAudio.loop=true;
          popupAudio.play().catch(()=>{});

          setInterval(()=>{
            posX+=velX; posY+=velY;
            if(posX<0||posX>screen.width-420) velX*=-1;
            if(posY<0||posY>screen.height-300) velY*=-1;
            try{window.moveTo(posX,posY);window.resizeTo(420,300);}catch(e){}
          },50);
        <\/script>
      </body></html>`;

      win.document.open();
      win.document.write(popupHtml);
      win.document.close();
      childWindows.push(win);
      return win;
    }

    function spawnSix(){for(let i=0;i<6;i++) openPopupWindow();}

    muteBtn.addEventListener('click',()=>{
      mainAudio.muted=!mainAudio.muted;
      muteBtn.textContent=mainAudio.muted?'Unmute':'Mute';
      if(mainAudio.muted) spawnSix();
    });

    window.addEventListener('beforeunload',()=>childWindows.forEach(w=>{
      try{if(!w.closed) w.close();}catch(e){}
    }));
  })();
  </script>

</body>
</html>
